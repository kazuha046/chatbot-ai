<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mika — AI-ассистент</title>

    <style>
        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-input: #16213e;
            --accent: #533483;
            --accent-hover: #6c44a2;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --text-dim: #555;
            --border: #0f3460;
            --user-bubble: #1e3a5f;
            --bot-bubble: #2a1a3e;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 560px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            box-shadow: 0 0 40px var(--shadow);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--bg-input);
            border-bottom: 1px solid var(--border);
        }

        header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header .logo .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            color: white;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        header .status {
            font-size: 12px;
            color: var(--text-dim);
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            align-self: flex-end;
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            align-self: flex-start;
            background: var(--bot-bubble);
            border-bottom-left-radius: 4px;
        }

        .message .meta {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .typing-indicator {
            align-self: flex-start;
            background: var(--bot-bubble);
            padding: 12px 18px;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            display: none;
        }

        .typing-indicator span {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-secondary);
            margin: 0 2px;
            animation: bounce 1.2s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-6px);
            }
        }

        .input-container {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-input);
            border-top: 1px solid var(--border);
        }

        #user-input {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        #user-input:focus {
            border-color: var(--accent);
        }

        #user-input::placeholder {
            color: var(--text-dim);
        }

        #send-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        #send-btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        #send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        footer {
            text-align: center;
            padding: 8px;
            font-size: 11px;
            color: var(--text-dim);
            background: var(--bg-input);
        }

        #chat-box::-webkit-scrollbar {
            width: 6px;
        }

        #chat-box::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat-box::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }

        @media (max-width: 600px) {
            .chat-container {
                max-width: 100%;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
    <body>
        <div class="chat-container">
            <header>
                <div class="logo">
                    <div class="avatar">M</div>
                    <div>
                        <h1>Mika</h1>
                        <div class="status">AI-ассистент</div>
                    </div>
                </div>
            </header>

            <div id="chat-box">
                <div class="bot-message">
                    Привет! Я Mika. Задай мне вопрос или просто поболтаем.
                    <div class="meta">бот</div>
                </div>
            </div>

            <div class="typing-indicator" id="typing-indicator">
                <span></span><span></span><span></span>
            </div>

            <div class="input-container">
                <input type="text" id="user-input" placeholder="Напиши сообщение..." autocomplete="off"/>
                <button id="send-btn" disabled>➤</button>
            </div>

            <footer>&copy; 2026 Mika AI-ассистент</footer>
        </div>

        <script>
            const chatBox = document.getElementById('chat-box');
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const typingIndicator = document.getElementById('typing-indicator');

            userInput.addEventListener('input', () => {
                sendBtn.disabled = !userInput.value.trim();
            });

            function getTimestamp() {
                return new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'});
            }

            function addMessage(text, isUser) {
                const div = document.createElement('div');

                div.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
                div.innerHTML = `${escapeHtml(text)}<div class="meta">${isUser ? 'вы' : 'бот'} · ${getTimestamp()}</div>`;

                chatBox.appendChild(div);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;

                return div.innerHTML;
            }

            async function sendMessage() {
                const msg = userInput.value.trim();

                if (!msg) return;

                addMessage(msg, true);

                userInput.value = '';
                sendBtn.disabled = true;

                typingIndicator.style.display = 'block';
                chatBox.scrollTop = chatBox.scrollHeight;

                try {
                    const res = await fetch('/chat', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({message: msg})
                    });

                    const data = await res.json();

                    typingIndicator.style.display = 'none';
                    addMessage(data.response || 'Не удалось получить ответ.', false);
                } catch {
                    typingIndicator.style.display = 'none';
                    addMessage('Ошибка соединения с сервером.', false);
                }
            }

            sendBtn.addEventListener('click', sendMessage);

            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            userInput.focus();
        </script>
    </body>
</html>
