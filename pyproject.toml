[project]
name = "chatbot-ai"
version = "1.3.0"
description = "A Russian-language AI chatbot. Built with TensorFlow/Keras, spaCy NLP, and NLTK."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "deep-translator>=1.11,<2",
    "flask>=3.1,<4",
    "keras>=3.15,<4",
    "nltk>=3.10,<4",
    "numpy>=2.5,<3",
    "pygobject>=3.50,<4",
    "python-dotenv>=1.2,<2",
    "requests>=2.34,<3",
    "scikit-learn>=1.9,<2",
    "spacy>=3.8,<3.9",
    "tensorflow>=2.21,<3",
    "ru-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/ru_core_news_lg-3.8.0/ru_core_news_lg-3.8.0-py3-none-any.whl",
    "pygobject-stubs>=2.17.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
